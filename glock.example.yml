# Example glock.yml for the current unversioned schema.
#
# This file is validated by TestParseConfigV2_ValidExample in
# internal/config/config_v2_test.go.

# Optional Go template rendered for each repository by glock tag.
tag_pattern: 'v{{ .Now.Format "20060102.150405" }}'

# Every source requires a local directory. Remote paths are relative to this
# file's folder. Filesystem paths use an existing directory directly and may
# be absolute or relative to the project root.
sources:
  backend:
    type: github                # git clone
    path: backend
    url: git@github.com:AzraelSec/backend.git
    head: main                  # configured branch or tag, required for github
    updater: "go mod"           # optional, inferred from lockfiles when omitted
    exclude_tag: false          # set true to skip this source when tagging
  frontend:
    type: github
    path: frontend
    url: git@github.com:AzraelSec/frontend.git
    head: master
  assets:
    type: http                  # accepted by the schema, acquisition is manual
    path: public
    url: https://example.com/assets.tar.gz
  tools:
    type: filesystem            # an existing local directory
    path: /opt/acme/tools

# Components run commands from the source directory. Sourceless components
# use the project root.
components:
  api:
    source: backend
    # Load dotenv files from the execution directory. Later files override
    # earlier files, and host environment values take precedence.
    env_filenames:
      - .env
      - .env.local
    run: "go run main.go"
  api-docs:
    source: backend
    run: "go run ./cmd/docs.go"
  SPA:
    source: frontend
    run: "pnpm run dev"
    on:
      steps:
        - startup: build-assets
          cleanup: clean-assets # registered after startup succeeds
  local-proxy:                  # sourceless: runs from the project folder
    run: "caddy reverse-proxy --from :8080 --to :3000"

# Workspaces group component keys for runtime operations. The CLI's
# glock start --repos filter takes Git source keys such as backend.
workspaces:
  backend-focused:
    - api
    - api-docs
  only-frontend:
    - SPA

# Project-level hooks use separate startup and shutdown lists. Each hook
# references a task by key. Use either lists or steps in each on block.
on:
  startup:
    - docker-compose-up
  shutdown:
    - docker-compose-down

# Tasks are one-shot commands declared once and referenced by key.
tasks:
  docker-compose-up:
    description: "run docker compose"
    run: docker-compose up -d
  docker-compose-down:
    description: "stop docker compose"
    run: docker-compose stop
  build-assets:
    description: "build assets"
    run: pnpm run build
  clean-assets:
    description: "clean built assets"
    run: pnpm run clean
  print-port:
    description: "print out current PORT"
    run: echo $PORT
